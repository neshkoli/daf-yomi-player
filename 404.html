<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Daf Yomi - Mevaser Zion</title>
        <script>
            // Single Page Apps for GitHub Pages redirect
            var isGitHubIo = window.location.hostname.indexOf('github.io') !== -1;
            var pathSegmentsToKeep = (isGitHubIo && window.location.pathname.split('/').length > 2) ? 1 : 0;

            var l = window.location;
            var repoPrefix = pathSegmentsToKeep > 0 ? '/' + l.pathname.split('/')[1] : '';
            var pathAfterRepo = l.pathname.slice(repoPrefix.length);
            if (pathAfterRepo.startsWith('/')) pathAfterRepo = pathAfterRepo.slice(1);

            var query = pathAfterRepo.replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '');

            var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                repoPrefix + '/?/' + query + l.hash;

            l.replace(redirectUrl);
        </script>
    </head>
    <body>
    </body>
</html>
